# App IPA (iPhone: LiveContainer / SideStore, non firmata) e APK (Android, firmato con la chiave di debug).
# Partono a ogni push sul ramo fmlab-monsters, con i tag v* e a mano.
# L'URL del server Google si imposta una volta sola:
#   gh variable set FMLAB_SERVER_URL -R cipherdesk007-max/gpsbye --body "https://script.google.com/macros/s/…/exec"
# Se è vuoto le app funzionano lo stesso (modalità locale + campo URL nel gioco, Sfide › Server).
# Prova sui telefoni simulati (iPhone nel Simulatore, Android nell'emulatore): parte con i tag v* oppure
# quando il messaggio del commit contiene [telefoni] (è lenta, non la si fa a ogni modifica).
name: App
on:
  push:
    branches: [fmlab-monsters]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: IPA iPhone
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: File del gioco
        run: |
          node scripts/build-web.js "${{ vars.FMLAB_SERVER_URL }}"
          rm -rf apps/ios/FMLABMonsters/web && cp -R dist/web apps/ios/FMLABMonsters/web
          cp apps/autotest.js apps/ios/FMLABMonsters/web/autotest.js   # gira solo con l'argomento -autotest
          ls apps/ios/FMLABMonsters/web
      - name: Progetto Xcode (XcodeGen)
        run: |
          brew install xcodegen
          cd apps/ios && xcodegen generate
          xcodebuild -version
      - name: Compila (iPhoneOS, senza firma)
        run: |
          set -o pipefail
          cd apps/ios
          xcodebuild -project FMLABMonsters.xcodeproj -scheme FMLABMonsters -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errori di compilazione (se fallisce)
        if: failure()
        run: grep -n -B3 -A8 "error:" apps/ios/build.log | head -200 || true
      - name: Impacchetta e controlla l'IPA
        run: |
          set -e
          cd apps/ios
          APP="build/Build/Products/Release-iphoneos/FMLABCristalia.app"
          test -d "$APP"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleDisplayName|CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|UISupportedInterfaceOrientations|UIStatusBarHidden|MinimumOSVersion"
          for f in index.html config.js engine.js world.js story.js server-core.js art.js gl3d.js models.js audio.js horde.js game.js style.css; do test -f "$APP/web/$f" || { echo "manca web/$f"; exit 1; }; done
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry FMLAB-Cristalia.ipa Payload
          unzip -l FMLAB-Cristalia.ipa | grep -E "web/index.html|FMLABCristalia$"
          shasum -a 256 FMLAB-Cristalia.ipa
      - uses: actions/upload-artifact@v4
        with: { name: FMLAB-Cristalia-iOS, path: apps/ios/FMLAB-Cristalia.ipa, retention-days: 30 }

  apk:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: File del gioco
        run: |
          node scripts/build-web.js "${{ vars.FMLAB_SERVER_URL }}"
          mkdir -p apps/android/app/src/main/assets
          rm -rf apps/android/app/src/main/assets/web && cp -R dist/web apps/android/app/src/main/assets/web
          cp apps/autotest.js apps/android/app/src/main/assets/web/autotest.js   # gira solo con --ez autotest true
      - name: Compila l'APK
        run: cd apps/android && gradle assembleRelease --no-daemon --stacktrace
      - name: Controlla l'APK
        run: |
          set -e
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          for f in index.html config.js engine.js gl3d.js models.js game.js; do unzip -l "$APK" | grep -q "assets/web/$f" || { echo "manca assets/web/$f"; exit 1; }; done
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK" | grep -E "package:|application-label|sdkVersion|targetSdkVersion|uses-permission"
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          cp "$APK" FMLAB-Cristalia.apk
          sha256sum FMLAB-Cristalia.apk
      - uses: actions/upload-artifact@v4
        with: { name: FMLAB-Cristalia-Android, path: FMLAB-Cristalia.apk, retention-days: 30 }

  ios-simulatore:
    name: Prova su iPhone simulato
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[telefoni]')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: File del gioco
        run: |
          node scripts/build-web.js "${{ vars.FMLAB_SERVER_URL }}"
          rm -rf apps/ios/FMLABMonsters/web && cp -R dist/web apps/ios/FMLABMonsters/web
          cp apps/autotest.js apps/ios/FMLABMonsters/web/autotest.js
      - name: Compila per il Simulatore
        run: |
          set -o pipefail
          brew install xcodegen
          cd apps/ios && xcodegen generate
          xcodebuild -project FMLABMonsters.xcodeproj -scheme FMLABMonsters -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Due avvii nel Simulatore
        run: |
          set -u
          APP=apps/ios/build/Build/Products/Release-iphonesimulator/FMLABCristalia.app
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; c.sort(key=lambda t: t[0]); print(c[-1][1]['udid'])")
          echo "Simulatore: $UDID"; xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p foto
          for n in 1 2; do
            xcrun simctl launch --console-pty --terminate-running-process "$UDID" it.fmlab.cristalia -autotest > run$n.log 2>&1 &
            for i in $(seq 1 60); do grep -q "AUTOTEST {" run$n.log && break; sleep 2; done
            sleep 2
            xcrun simctl io "$UDID" screenshot foto/iphone-$n.png
            xcrun simctl terminate "$UDID" it.fmlab.cristalia || true
            sleep 3
          done
          python3 apps/check-autotest.py run1.log run2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: foto-iphone-simulato, path: foto/, retention-days: 30 }

  android-emulatore:
    name: Prova su Android emulato
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[telefoni]')
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: FMLAB-Cristalia-Android }
      - name: Accelerazione (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash apps/android/prova-emulatore.sh FMLAB-Cristalia.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: foto-android-emulato, path: "foto/\nrun*.log\nlogcat-*.txt", retention-days: 30 }
