# App IPA (iPhone, da firmare con SideStore) e APK (Android). A mano da Actions › App › Run workflow,
# oppure creando un tag v1.0, v1.1… L'URL del server Google va in Settings › Variables › FMLAB_SERVER_URL.
name: App
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-web.js "${{ vars.FMLAB_SERVER_URL }}"
      - run: rm -rf apps/ios/FMLABMonsters/web && cp -R dist/web apps/ios/FMLABMonsters/web
      - run: brew install xcodegen && cd apps/ios && xcodegen generate
      - run: |
          cd apps/ios
          xcodebuild -project FMLABMonsters.xcodeproj -scheme FMLABMonsters -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -30
          mkdir -p Payload && cp -R "build/Build/Products/Release-iphoneos/FMLAB Monsters.app" Payload/
          zip -qry FMLAB-Monsters.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: FMLAB-Monsters-iOS, path: apps/ios/FMLAB-Monsters.ipa }
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: node scripts/build-web.js "${{ vars.FMLAB_SERVER_URL }}"
      - run: mkdir -p apps/android/app/src/main/assets && rm -rf apps/android/app/src/main/assets/web && cp -R dist/web apps/android/app/src/main/assets/web
      - run: cd apps/android && gradle assembleRelease --no-daemon
      - run: cp apps/android/app/build/outputs/apk/release/app-release.apk FMLAB-Monsters.apk
      - uses: actions/upload-artifact@v4
        with: { name: FMLAB-Monsters-Android, path: FMLAB-Monsters.apk }
