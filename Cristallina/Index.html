<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1422">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FMLAB Cristalia</title>
<style>
:root {
  --bg: #0f1422; --card: #1a2133; --card2: #232c42; --txt: #eef2fb; --mut: #93a0bb;
  --acc: #3b82f6; --acc2: #22c55e; --bad: #ef4444; --warn: #f59e0b;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
  font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
#app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
input { font: inherit; }
.screen { flex: 1; display: flex; flex-direction: column; padding: calc(14px + var(--safe-t)) 16px calc(16px + var(--safe-b)); gap: 14px; }
h1 { margin: 0; font-size: 30px; letter-spacing: .3px; }
h2 { margin: 0; font-size: 21px; }
.mut { color: var(--mut); font-size: 14px; }
.btn { background: var(--acc); padding: 14px 16px; border-radius: 14px; font-weight: 700; font-size: 17px; }
.btn.sec { background: var(--card2); }
.btn.green { background: var(--acc2); color: #04210f; }
.btn.red { background: var(--bad); }
.btn:disabled { opacity: .45; }
.row { display: flex; gap: 10px; align-items: center; }
.grow { flex: 1; }
.card { background: var(--card); border-radius: 16px; padding: 14px; }
.field { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #33405e; background: #0c1120; color: var(--txt); font-size: 17px; }
.logo { text-align: center; padding-top: 24px; }
.logo .big { font-size: 40px; font-weight: 900; }
.logo .sub { color: var(--mut); margin-top: 4px; }
.hero { display: flex; justify-content: center; gap: 4px; margin: 6px 0 4px; }
.pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #0b0f1a; }

/* Scelta iniziale */
.starters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.starter { background: var(--card); border-radius: 16px; padding: 8px 4px 10px; text-align: center; border: 2px solid transparent; }
.starter.sel { border-color: var(--acc); background: var(--card2); }
.starter .n { font-weight: 800; margin-top: 2px; }

/* Mappa */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hud .zone { font-weight: 800; }
.mapwrap { position: relative; border-radius: 16px; overflow: hidden; background: #000; touch-action: none; }
canvas { display: block; width: 100%; image-rendering: pixelated; }
.toast { position: absolute; left: 10px; right: 10px; bottom: 10px; background: rgba(8,12,22,.88); padding: 10px 12px; border-radius: 12px; font-size: 15px; display: none; }
.controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px; }
.dpad button { background: var(--card2); border-radius: 14px; font-size: 22px; touch-action: none; user-select: none; }
.dpad button:active { background: var(--acc); }
.menu { display: grid; grid-template-columns: 1fr; gap: 8px; flex: 1; max-width: 170px; }
.menu .btn { padding: 12px; font-size: 15px; }

/* Lotta */
.battle { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.arena { position: relative; height: 300px; border-radius: 18px; overflow: hidden;
  background: linear-gradient(#7cc4ff 0%, #bfe6ff 46%, #8fd18a 46%, #5fae5a 100%); }
.arena.bosco { background: linear-gradient(#3f7d58 0%, #6fae7c 46%, #3d7d45 46%, #2c5e33 100%); }
.arena.grotta { background: linear-gradient(#2b2b3c 0%, #4a4a63 46%, #5c5244 46%, #3e372d 100%); }
.arena.pvp { background: linear-gradient(#24124a 0%, #4b2a8a 46%, #1f3b6e 46%, #12264a 100%); }
.plat { position: absolute; border-radius: 50%; background: rgba(0,0,0,.18); }
.foe { position: absolute; right: 8px; top: 34px; text-align: center; }
.me { position: absolute; left: 4px; bottom: 6px; }
.infobox { position: absolute; background: rgba(255,255,255,.92); color: #111827; border-radius: 12px; padding: 7px 10px; min-width: 165px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.infobox .nm { font-weight: 800; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.foeinfo { left: 10px; top: 12px; }
.meinfo { right: 10px; bottom: 16px; }
.hpbar { height: 8px; border-radius: 4px; background: #d1d5db; overflow: hidden; margin-top: 5px; }
.hpbar i { display: block; height: 100%; background: #22c55e; transition: width .45s ease; }
.hpbar i.mid { background: #f59e0b; } .hpbar i.low { background: #ef4444; }
.hptext { font-size: 12px; text-align: right; margin-top: 2px; color: #374151; }
.xpbar { height: 4px; background: #e5e7eb; border-radius: 2px; margin-top: 4px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: #3b82f6; }
.log { background: var(--card); border-radius: 14px; padding: 12px 14px; min-height: 66px; font-size: 16px; line-height: 1.35; }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.move { border-radius: 13px; padding: 11px 10px; text-align: left; color: #0b0f1a; font-weight: 800; }
.move small { display: block; font-weight: 600; opacity: .75; font-size: 12px; }
.acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.shake { animation: shake .35s; } @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
.flash { animation: flash .35s; } @keyframes flash { 50% { opacity: .2 } }
.faint { transition: transform .5s, opacity .5s; transform: translateY(30px); opacity: 0; }
.capsule { position: absolute; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(#22c55e 50%, #f8fafc 50%); border: 3px solid #0b0f1a; right: 70px; top: 120px; animation: wobble .5s 3; }
@keyframes wobble { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-25deg) } 75% { transform: rotate(25deg) } }

/* Squadra, archivio */
.list { display: flex; flex-direction: column; gap: 8px; }
.mon { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 8px 12px 8px 6px; }
.mon .info { flex: 1; }
.mon .nm { font-weight: 800; display: flex; justify-content: space-between; }
.mon.lead { outline: 2px solid var(--acc); }
.dex { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dexc { background: var(--card); border-radius: 14px; text-align: center; padding: 6px 4px 8px; font-size: 13px; }
.dexc .num { color: var(--mut); font-size: 11px; }
.code { font-size: 44px; font-weight: 900; letter-spacing: 8px; text-align: center; padding: 10px; background: #0c1120; border-radius: 14px; }
.lb { display: flex; justify-content: space-between; padding: 8px 2px; border-bottom: 1px solid #263048; }
.waiting { display: flex; align-items: center; gap: 10px; }
.spinner { width: 18px; height: 18px; border: 3px solid #33405e; border-top-color: var(--acc); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
.tabs { display: flex; gap: 8px; }
.tabs .btn { flex: 1; padding: 10px; font-size: 15px; }
.err { color: #fca5a5; font-size: 14px; }

/* 3D */
.gl3d { display: block; width: 100%; height: 100%; image-rendering: auto; }
.hero3d { height: 190px; }
.pick3d { height: 200px; border-radius: 18px; background: radial-gradient(circle at 50% 70%, #26305a, #0f1422 70%); }
.map3d { height: 416px; }
.arena.arena3d { height: 330px; background: #000; }
.stage3d { position: absolute; inset: 0; }
.viewer3d { height: 300px; border-radius: 18px; background: radial-gradient(circle at 50% 65%, #2a3566, #0f1422 72%); display: flex; align-items: center; justify-content: center; }
.dexc { color: inherit; border: 0; font: inherit; }
.dexc.got { cursor: pointer; }
.dexc:disabled { opacity: .75; }
.stat { display: grid; grid-template-columns: 70px 1fr 34px; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; }
.stat b { text-align: right; }
.sbar { height: 8px; background: #263048; border-radius: 4px; overflow: hidden; }
.sbar i { display: block; height: 100%; border-radius: 4px; }

/* Tutto schermo (mappa e lotta in 3D) */
.screen.full { position: fixed; inset: 0; padding: 0; gap: 0; z-index: 5; touch-action: none; overscroll-behavior: none; }
.full .mapwrap { position: absolute; inset: 0; border-radius: 0; }
.full .map3d { height: 100%; }
.glass { background: rgba(10, 14, 26, .66); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.full .hud { position: absolute; z-index: 3; top: calc(8px + var(--safe-t)); left: calc(10px + env(safe-area-inset-left, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
  background: rgba(10, 14, 26, .66); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 16px; padding: 8px 10px 8px 14px; }
.ico { width: 40px; height: 40px; border-radius: 12px; background: rgba(255, 255, 255, .12); font-size: 20px; flex: none; }
.ico:active { background: var(--acc); }
.full .toast { top: calc(74px + var(--safe-t)); bottom: auto; z-index: 3; }
.full .controls { position: absolute; z-index: 3; left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + var(--safe-b)); align-items: flex-end; pointer-events: none; }
.full .controls > * { pointer-events: auto; }
.full .dpad button { background: rgba(14, 20, 36, .58); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }
.full .dpad button:active { background: var(--acc); }
.full .menu .btn.sec { background: rgba(14, 20, 36, .66); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

.full .battle { position: absolute; inset: 0; gap: 0; }
.full .arena { position: absolute; inset: 0; height: auto; border-radius: 0; }
.full .foeinfo { top: calc(10px + var(--safe-t)); left: calc(10px + env(safe-area-inset-left, 0px)); }
.full .meinfo { top: auto; right: 10px; bottom: calc(298px + var(--safe-b)); }
.full .infobox { background: rgba(255, 255, 255, .88); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.full .bpanel { position: absolute; z-index: 3; left: 10px; right: 10px; bottom: calc(10px + var(--safe-b)); display: flex; flex-direction: column; gap: 8px; }
.full .log { background: rgba(10, 14, 26, .78); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); min-height: 58px; }
.full .move { box-shadow: 0 3px 12px rgba(0, 0, 0, .25); }
.full #actions .btn.sec, .full #actions .card { background: rgba(14, 20, 36, .72); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.full #actions .list { max-height: 46vh; overflow: auto; }

/* Telefono girato in orizzontale */
@media (orientation: landscape) and (max-height: 560px) {
  .full .hud { right: auto; width: min(430px, 55vw); }
  .full .toast { left: auto; right: 12px; top: auto; bottom: calc(12px + var(--safe-b)); width: min(380px, 42vw); }
  .full .controls { justify-content: space-between; }
  .full .menu { max-width: 150px; }
  .full .bpanel { left: auto; top: calc(10px + var(--safe-t)); right: calc(10px + env(safe-area-inset-right, 0px)); width: 340px; justify-content: flex-end; }
  .full .meinfo { top: auto; bottom: calc(12px + var(--safe-b)); right: auto; left: calc(10px + env(safe-area-inset-left, 0px)); }
  .full .log { font-size: 15px; }
  .full #actions .list { max-height: 60vh; }
}

/* Sala Online, FMLAB Pod, inviti */
.ico { position: relative; }
.ico .dot { display: none; position: absolute; top: 5px; right: 5px; width: 9px; height: 9px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 0 2px #0f1422; }
.lounge3d { height: 170px; border-radius: 18px; background: radial-gradient(circle at 50% 70%, #2a3566, #0f1422 72%); }
.invite, .centercard { display: none; position: relative; z-index: 4; }
.full .invite { position: absolute; top: calc(78px + var(--safe-t)); left: 10px; right: 10px; }
.full .centercard { position: absolute; left: 10px; right: 10px; bottom: calc(210px + var(--safe-b)); }
.invite .card, .centercard .card { padding: 10px 12px; }
.invite .btn, .centercard .btn { padding: 10px 14px; font-size: 15px; }
.card.glass { background: rgba(10, 14, 26, .82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
@media (orientation: landscape) and (max-height: 560px) {
  .full .invite { left: auto; width: min(420px, 50vw); top: calc(10px + var(--safe-t)); right: 10px; }
  .full .centercard { left: auto; right: 180px; width: min(380px, 45vw); bottom: calc(12px + var(--safe-b)); }
}

/* Storia: dialoghi, stati, shiny, Diario */
.dlg { display: none; position: fixed; z-index: 60; left: 10px; right: 10px; bottom: calc(14px + var(--safe-b)); max-width: 640px; margin: 0 auto;
  background: linear-gradient(180deg, #fafcff, #e6ecf8); color: #111827; border-radius: 18px; padding: 22px 18px 16px;
  border: 3px solid #1e293b; box-shadow: 0 10px 30px rgba(0, 0, 0, .45), inset 0 0 0 2px rgba(255, 255, 255, .7); cursor: pointer; user-select: none; -webkit-user-select: none; }
.dlg.sys { background: linear-gradient(180deg, #1e293b, #0f172a); color: #fef3c7; border-color: #f59e0b; text-align: center; }
.dlgName { position: absolute; top: -15px; left: 16px; background: #1e293b; color: #fff; font-weight: 800; font-size: 14px; padding: 5px 12px; border-radius: 10px; letter-spacing: .2px; }
.dlgText { font-size: 17px; line-height: 1.42; min-height: 50px; font-weight: 600; }
.dlgNext { position: absolute; right: 14px; bottom: 6px; font-size: 13px; color: #3b82f6; animation: dlgbob 0.9s ease-in-out infinite; }
.dlg.sys .dlgNext { color: #f59e0b; }
@keyframes dlgbob { 50% { transform: translateY(3px); } }
.stag { display: inline-block; margin-left: 5px; padding: 2px 6px; border-radius: 6px; font-size: 11px; font-weight: 800; color: #fff; vertical-align: middle; }
.shiny { margin-left: 3px; filter: drop-shadow(0 0 3px #fde68a); }
.menu { grid-template-columns: 1fr 1fr; }
.menu .btn { padding: 11px 6px; font-size: 14px; }
.full .menu { max-width: 190px; }
.diary .goal { background: linear-gradient(135deg, #1e3a8a, #312e81); }
.goalText { font-size: 17px; font-weight: 700; margin-top: 4px; line-height: 1.35; }
.badges { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
.badge { text-align: center; padding: 8px 2px; border-radius: 14px; background: #0c1120; border: 2px dashed #33405e; }
.badge.got { background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--c) 45%, transparent), #0c1120 75%); border: 2px solid var(--c); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 50%, transparent); }
.badge .bi { font-size: 26px; line-height: 1.2; }
.badge:not(.got) .bi { color: #4b5563; font-weight: 900; }
.badge .bn { font-size: 10.5px; font-weight: 700; margin-top: 3px; min-height: 26px; }
.badge .bw { font-size: 10px; color: var(--mut); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.stats div { display: flex; justify-content: space-between; border-bottom: 1px solid #263048; padding: 6px 0; font-size: 14px; }
.stats span { color: var(--mut); }
@media (orientation: landscape) and (max-height: 560px) {
  .dlg { left: 20%; right: 20%; bottom: calc(10px + var(--safe-b)); padding: 18px 16px 12px; }
  .dlgText { font-size: 16px; min-height: 40px; }
  .stats { grid-template-columns: 1fr 1fr 1fr; gap: 2px 14px; }
  .screen.diary { gap: 8px; padding-top: calc(8px + var(--safe-t)); }
  .diary h2 { font-size: 18px; }
  .diary .btn { padding: 9px 14px; }
  .diary .card { padding: 10px 12px; }
  .goalText { font-size: 15px; }
  .badges { margin-top: 6px; }
  .badge { padding: 4px 2px; }
  .badge .bi { font-size: 19px; }
  .badge .bn { min-height: 0; font-size: 9.5px; }
  .stats div { padding: 3px 0; font-size: 13px; }
}

/* riquadro in alto della mappa: una riga sola, niente testo a capo */
.full .hud .grow { min-width: 0; }
.full .hud .zone, .full .hud .mut { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.full .hud .zone { font-size: 15px; }
.full .hud .mut { font-size: 12px; }
.full .hud > div[style*="width:130px"] { width: 104px !important; flex: none; }

.full .hud .zone { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
.full .hud .mut { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.full .hud .grow { min-width: 0; }
.full .hud .ico { width: 36px; height: 36px; font-size: 18px; }

.menu .btn.orda { background: linear-gradient(90deg, #f97316, #ef4444); }


/* ======================================================================
   Sensazione di gioco: titolo, pulsanti, transizioni, numeri, vittoria, evoluzione, impostazioni
   ====================================================================== */
html, body { font-family: -apple-system, "SF Pro Rounded", "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h2 { letter-spacing: .2px; font-weight: 800; }
.btn { box-shadow: 0 4px 0 rgba(0,0,0,.3), 0 8px 18px rgba(0,0,0,.18); transition: transform .08s ease, box-shadow .08s ease, filter .15s ease; position: relative; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.3), 0 3px 8px rgba(0,0,0,.18); }
.btn.green { background: linear-gradient(180deg, #34d399, #22c55e); }
.btn:not(.sec):not(.green):not(.red):not(.orda) { background: linear-gradient(180deg, #60a5fa, #3b82f6); }
.btn.red { background: linear-gradient(180deg, #f87171, #ef4444); }
.move { box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.35), 0 5px 12px rgba(0,0,0,.22); transition: transform .08s ease, filter .15s; }
.move:active { transform: translateY(2px) scale(.98); filter: brightness(1.08); }
.dpad button { box-shadow: 0 4px 0 rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.25); transition: transform .06s; }
.dpad button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.ico { transition: transform .08s, background .15s; } .ico:active { transform: scale(.92); }
.card, .moves, .acts, .titleMenu .card, .list .mon { animation: popIn .26s cubic-bezier(.2,.9,.3,1) both; }
.list .mon:nth-child(2) { animation-delay: .03s; } .list .mon:nth-child(3) { animation-delay: .06s; } .list .mon:nth-child(4) { animation-delay: .09s; } .list .mon:nth-child(5) { animation-delay: .12s; } .list .mon:nth-child(6) { animation-delay: .15s; }
@keyframes popIn { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.menu .btn.orda { background: linear-gradient(180deg, #fb923c, #ef4444); }
#mSet { font-size: 13px; }
.hpbar { position: relative; }
.hpbar i { position: relative; }
.hpbar .lag { position: absolute; left: 0; top: 0; bottom: 0; background: #fff4c2; border-radius: 4px; transition: width .75s ease .4s; }
.infobox { box-shadow: 0 6px 18px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.6); border: 1px solid rgba(255,255,255,.6); }

/* Titolo */
.screen.title { position: fixed; inset: 0; z-index: 2; overflow-x: hidden; overflow-y: auto; padding-left: max(16px, calc(50vw - 224px)); padding-right: max(16px, calc(50vw - 224px)); background: radial-gradient(130% 75% at 50% 0%, #22357a 0%, #131c3d 45%, #0f1422 75%); }
.title .stars { position: absolute; inset: 0; pointer-events: none; opacity: .7; animation: twinkle 3.5s ease-in-out infinite alternate;
  background-image: radial-gradient(1.6px 1.6px at 12% 18%, #fff 50%, transparent 52%), radial-gradient(1.2px 1.2px at 32% 8%, #dbeafe 50%, transparent 52%),
    radial-gradient(1.8px 1.8px at 78% 14%, #fff 50%, transparent 52%), radial-gradient(1.2px 1.2px at 88% 32%, #fde68a 50%, transparent 52%),
    radial-gradient(1.4px 1.4px at 58% 22%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 6% 44%, #fff 50%, transparent 52%),
    radial-gradient(1.4px 1.4px at 94% 52%, #bfdbfe 50%, transparent 52%), radial-gradient(1px 1px at 46% 4%, #fff 50%, transparent 52%); }
@keyframes twinkle { from { opacity: .35; } to { opacity: .85; } }
.title .logo { position: relative; padding-top: 22px; }
.title .logo .big { font-size: 64px; line-height: .95; letter-spacing: 3px; }
.title .logo .big2 { font-size: 30px; font-weight: 900; letter-spacing: 8px; margin-top: 4px; padding-left: 8px; }
.l1, .l2 { display: inline-block; animation: drop .75s cubic-bezier(.2,1.5,.4,1) both; animation-delay: calc(var(--i) * .07s); -webkit-background-clip: text; background-clip: text; color: transparent; }

<script>
/*
 * FMLAB Monsters — motore di gioco
 * Creature, tipi e mosse ORIGINALI. Nessun dato o grafica di altri giochi.
 *
 * Il motore è deterministico: con lo stesso seme e le stesse scelte, due

(function (root, factory) {

  // ---------- Generatore casuale con seme (mulberry32) ----------
  function makeRng(seed) {
    let a = seed >>> 0;

      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);

  // ---------- Creature (15, originali) ----------

  const SPECIES = {

                learn: [[1, 'botta'], [1, 'spruzzo'], [7, 'getto'], [9, 'scatto'], [14, 'onda'], [26, 'maremoto']] },
    ondaro:   { name: 'Ondaro',   type: 'acqua',   base: [59, 63, 80, 58], evo: { to: 'abissaro', level: 24 }, stage: 2,
                learn: [[1, 'botta'], [1, 'spruzzo'], [7, 'getto'], [9, 'scatto'], [14, 'onda'], [26, 'maremoto']] },
    abissaro: { name: 'Abissaro', type: 'acqua',   base: [79, 83, 100, 78], stage: 3,
                learn: [[1, 'spruzzo'], [1, 'getto'], [1, 'onda'], [1, 'scatto'], [26, 'maremoto']] },
    semino:   { name: 'Semino',   type: 'erba',    base: [45, 49, 49, 45], evo: { to: 'fogliardo', level: 12 }, stage: 1,
                learn: [[1, 'botta'], [1, 'fogliolama'], [7, 'spine'], [9, 'scatto'], [11, 'polline'], [14, 'radici'], [26, 'foresta']] },
    fogliardo:{ name: 'Fogliardo',type: 'erba',    base: [60, 62, 63, 60], evo: { to: 'silvatron', level: 24 }, stage: 2,
                learn: [[1, 'botta'], [1, 'fogliolama'], [7, 'spine'], [9, 'scatto'], [11, 'polline'], [14, 'radici'], [26, 'foresta']] },
    silvatron:{ name: 'Silvatron',type: 'erba',    base: [80, 82, 83, 80], stage: 3,
                learn: [[1, 'fogliolama'], [1, 'spine'], [1, 'radici'], [1, 'polline'], [26, 'foresta']] },
    voltino:  { name: 'Voltino',  type: 'elettro', base: [35, 55, 40, 90], evo: { to: 'fulmix', level: 16 }, stage: 1,
                learn: [[1, 'botta'], [1, 'scossa'], [4, 'lampo'], [6, 'ronzio'], [8, 'scatto'], [10, 'corrente'], [13, 'saetta'], [22, 'tempesta']] },
    fulmix:   { name: 'Fulmix',   type: 'elettro', base: [60, 90, 55, 110], stage: 2,
                learn: [[1, 'scossa'], [1, 'lampo'], [1, 'ronzio'], [1, 'corrente'], [1, 'saetta'], [22, 'tempesta']] },
    sassetto: { name: 'Sassetto', type: 'roccia',  base: [55, 70, 90, 30], evo: { to: 'granitor', level: 18 }, stage: 1,
                learn: [[1, 'botta'], [1, 'sassata'], [5, 'scheggia'], [10, 'scatto'], [16, 'frana']] },
    granitor: { name: 'Granitor', type: 'roccia',  base: [80, 100, 120, 45], stage: 2,
                learn: [[1, 'sassata'], [1, 'scheggia'], [1, 'scatto'], [1, 'frana']] },
    ombrino:  { name: 'Ombrino',  type: 'ombra',   base: [40, 60, 40, 80], evo: { to: 'spettrax', level: 18 }, stage: 1,
                learn: [[1, 'botta'], [1, 'ombrapugno'], [7, 'ninnananna'], [10, 'scatto'], [12, 'fiele'], [16, 'eclissi']] },
    spettrax: { name: 'Spettrax', type: 'ombra',   base: [65, 95, 60, 105], stage: 2,
                learn: [[1, 'ombrapugno'], [1, 'ninnananna'], [1, 'fiele'], [1, 'scatto'], [1, 'eclissi']] },
  };

  const STARTERS = ['fiammino', 'goccino', 'semino'];

  // Creature selvatiche per zona: [specie, livello min, livello max]
  const ZONES = {
    prato:  [['semino', 2, 5], ['voltino', 2, 5], ['sassetto', 3, 5], ['goccino', 2, 4], ['fiammino', 2, 4]],
    bosco:  [['ombrino', 5, 9], ['voltino', 5, 9], ['fogliardo', 12, 14], ['sassetto', 6, 9]],
    grotta: [['sassetto', 9, 14], ['ombrino', 9, 14], ['granitor', 18, 20], ['spettrax', 18, 20]],
    fiume:  [['goccino', 5, 9], ['voltino', 5, 9], ['semino', 5, 8], ['ondaro', 12, 14], ['fiammino', 5, 8]],
  };

  // ---------- Statistiche ----------
  /**
   * Statistiche dal livello, dai talenti (0..15, 8 = medio) e dal carattere.
   * Con talenti 8 e carattere neutro il risultato è identico alla prima versione
   * del gioco: le creature dei salvataggi vecchi non cambiano.
   */
  function statsFor(speciesId, level, talents, nature) {
    const sp = SPECIES[speciesId];
    const [bhp, batk, bdef, bspd] = sp.base;
    const t = validTalents(talents) ? talents : DEFAULT_TALENTS;
    const nat = NATURES[nature] || NATURES[DEFAULT_NATURE];
    const raw = (b, i) => Math.floor(((2 * b + 2 * (t[i] - 8)) * level) / 100);
    const mul = (stat, v) => (nat.up === stat ? Math.floor(v * 1.1) : nat.down === stat ? Math.floor(v * 0.9) : v);
    return {
      maxhp: raw(bhp, 0) + level + 10,
      atk: mul('atk', raw(batk, 1) + 5),
      def: mul('def', raw(bdef, 2) + 5),
      spd: mul('spd', raw(bspd, 3) + 5),
    };
  }
  function validTalents(t) { return Array.isArray(t) && t.length === 4 && t.every((v) => Number.isInteger(v) && v >= 0 && v <= 15); }

  function movesFor(speciesId, level) {
    const learned = SPECIES[speciesId].learn.filter(([l]) => l <= level).map(([, m]) => m);
    const unique = [...new Set(learned)];
    return unique.slice(-4);
  }

  function xpForLevel(level) { return Math.floor(Math.pow(level, 3) * 0.8); }

  /**
   * Nuova creatura. opts facoltativo: { shiny, talents, nature, rng }.
   * Senza opts: rara (shiny) 1 volta su 512, talenti e carattere a caso.
   */
  function createMonster(speciesId, level, idSeed, opts) {
    opts = opts || {};
    const rand = typeof opts.rng === 'function' ? opts.rng : Math.random;
    const shiny = typeof opts.shiny === 'boolean' ? opts.shiny : rand() < SHINY_RATE;
    const talents = validTalents(opts.talents) ? opts.talents.slice() : [0, 0, 0, 0].map(() => Math.floor(rand() * 16));
    const nature = NATURES[opts.nature] ? opts.nature : NATURE_IDS[Math.floor(rand() * NATURE_IDS.length)];
    const st = statsFor(speciesId, level, talents, nature);
    return {
      uid: idSeed != null ? String(idSeed) : String(Date.now()) + Math.floor(Math.random() * 1e6),
      species: speciesId,
      name: SPECIES[speciesId].name,
      level,
      xp: xpForLevel(level),
      hp: st.maxhp,
      ...st,
      moves: movesFor(speciesId, level),
      shiny, talents, nature, status: null,
    };
  }

  function recalc(mon) {
    const st = statsFor(mon.species, mon.level, mon.talents, mon.nature);
    const lost = mon.maxhp - mon.hp;
    Object.assign(mon, st);
    mon.hp = Math.max(0, Math.min(st.maxhp, st.maxhp - lost));
    mon.name = SPECIES[mon.species].name;
    return mon;
  }

  /** Aggiunge esperienza: ritorna gli eventi (livello, nuove mosse, evoluzione). */
  function gainXp(mon, amount) {
    const events = [];
    mon.xp += amount;
    while (mon.level < 50 && mon.xp >= xpForLevel(mon.level + 1)) {
      mon.level += 1;
      const before = mon.moves.slice();
      recalc(mon);
      mon.hp = Math.min(mon.maxhp, mon.hp + 5);
      events.push({ kind: 'level', level: mon.level });
      const sp = SPECIES[mon.species];
      if (sp.evo && mon.level >= sp.evo.level) {
        const from = sp.name;
        mon.species = sp.evo.to;
        recalc(mon);
        events.push({ kind: 'evolve', from, to: SPECIES[mon.species].name });
      }
      const now = movesFor(mon.species, mon.level);
      const added = now.filter((m) => !before.includes(m));
      mon.moves = now;
      added.forEach((m) => events.push({ kind: 'move', move: MOVES[m].name }));
    }
    return events;
  }

  function xpReward(defeated) {
    const sp = SPECIES[defeated.species];
    return Math.floor((40 + 20 * sp.stage) * defeated.level / 5);
  }

  // ---------- Danno ----------
  function damage(attacker, defender, moveId, rng) {
    const mv = MOVES[moveId];
    const atkType = SPECIES[attacker.species].type;
    const defType = SPECIES[defender.species].type;
    if (rng() * 100 >= mv.acc) return { hit: false, dmg: 0, eff: 1, crit: false };
    if (!mv.power) return { hit: true, dmg: 0, eff: 1, crit: false, statusOnly: true };
    const type = mv.type || null;
    const eff = type ? effectiveness(type, defType) : 1;
    const stab = type && type === atkType ? 1.5 : 1;
    const crit = rng() < 1 / 16;
    const roll = 0.85 + rng() * 0.15;
    // la bruciatura dimezza l'attacco
    const atk = attacker.status === 'brn' ? attacker.atk * 0.5 : attacker.atk;
    const base = Math.floor(Math.floor((2 * attacker.level) / 5 + 2) * mv.power * atk / defender.def / 50) + 2;
    const dmg = Math.max(1, Math.floor(base * stab * eff * roll * (crit ? 1.5 : 1)));
    return { hit: true, dmg, eff, crit };
  }

  /** Probabilità di cattura (0..1): più la creatura è ferita, più è facile. */
  function catchChance(mon) {
    const sp = SPECIES[mon.species];
    const hpRatio = mon.hp / mon.maxhp;
    const rarity = sp.stage === 1 ? 1 : sp.stage === 2 ? 0.6 : 0.35;
    const st = mon.status === 'slp' ? 2 : mon.status ? 1.5 : 1;
    return Math.max(0.05, Math.min(0.95, ((1 - hpRatio * 0.85) * rarity + 0.05) * st));
  }

  // ---------- Lotta (deterministica) ----------
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /**
   * Crea lo stato di una lotta.
   * sides: [{name, team:[mon...]}, {name, team:[...]}]
   */
  function createBattle(seed, sides) {
    return {
      seed: seed >>> 0,
      rngState: seed >>> 0,
      turn: 0,
      sides: sides.map((s) => ({ name: s.name, team: clone(s.team), active: firstAlive(s.team) })),
      log: [],
      winner: null,
    };
  }

  function firstAlive(team) {
    const i = team.findIndex((m) => m.hp > 0);
    return i < 0 ? 0 : i;
  }

  function activeMon(side) { return side.team[side.active]; }

  /**
   * Risolve un turno. actions: [azione lato 0, azione lato 1]
   * azione = {kind:'move', move:'tizzone'} | {kind:'switch', to:2} | {kind:'none'}
   * Ritorna gli eventi del turno (anche aggiunti a state.log).
   */
  function resolveTurn(state, actions) {
    if (state.winner != null) return [];
    const rng = makeRng(state.rngState);
    const events = [];
    state.turn += 1;
    events.push({ t: 'turn', n: state.turn });

    // 1) cambi di creatura prima di tutto
    [0, 1].forEach((i) => {
      const a = actions[i];
      if (a && a.kind === 'switch') {
        const side = state.sides[i];
        if (side.team[a.to] && side.team[a.to].hp > 0 && a.to !== side.active) {
          side.active = a.to;
          events.push({ t: 'switch', side: i, to: a.to, name: activeMon(side).name });
        }
      }
    });

    // 2) ordine delle mosse: prima la priorità, poi la velocità (paralisi = metà), a parità decide il caso
    const movers = [0, 1].filter((i) => actions[i] && actions[i].kind === 'move');
    const chosen = (i) => { const me = activeMon(state.sides[i]); return me.moves.includes(actions[i].move) ? actions[i].move : me.moves[0]; };
    const prio = (i) => MOVES[chosen(i)].priority || 0;
    movers.sort((x, y) => {
      if (prio(x) !== prio(y)) return prio(y) - prio(x);
      return effSpeed(activeMon(state.sides[y])) - effSpeed(activeMon(state.sides[x]));
    });
    if (movers.length === 2 && prio(0) === prio(1) && effSpeed(activeMon(state.sides[0])) === effSpeed(activeMon(state.sides[1])) && rng() < 0.5) {
      movers.reverse();
    }

    for (const i of movers) {
      const side = state.sides[i], foe = state.sides[1 - i];
      const me = activeMon(side), them = activeMon(foe);
      if (me.hp <= 0 || them.hp <= 0) continue;
      // sonno e paralisi possono impedire di muoversi
      if (me.status === 'slp') {
        if ((me.slpT || 0) > 0) { me.slpT -= 1; events.push({ t: 'cant', side: i, reason: 'slp', name: me.name }); continue; }
        me.status = null; delete me.slpT;
        events.push({ t: 'wake', side: i, name: me.name });
      }
      if (me.status === 'par' && rng() < 0.25) { events.push({ t: 'cant', side: i, reason: 'par', name: me.name }); continue; }
      const moveId = chosen(i);
      const mv = MOVES[moveId];
      const r = damage(me, them, moveId, rng);
      events.push({ t: 'move', side: i, name: me.name, move: mv.name });
      if (!r.hit) { events.push({ t: 'miss', side: i }); continue; }
      if (r.statusOnly) {
        // mossa di stato: fallisce se il bersaglio ha già uno stato o ne è immune
        if (!inflict(them, mv.effect.status, rng, events, 1 - i)) events.push({ t: 'miss', side: i });
        continue;
      }
      them.hp = Math.max(0, them.hp - r.dmg);
      events.push({ t: 'hit', side: 1 - i, dmg: r.dmg, eff: r.eff, crit: r.crit, hp: them.hp, maxhp: them.maxhp });
      if (them.hp <= 0) {
        events.push({ t: 'faint', side: 1 - i, name: them.name });
      } else if (mv.effect && rng() * 100 < mv.effect.chance) {
        inflict(them, mv.effect.status, rng, events, 1 - i);
      }
    }

    // 2b) fine turno: bruciatura e veleno tolgono vita
    [0, 1].forEach((i) => {
      const mon = activeMon(state.sides[i]);
      if (mon.hp <= 0 || (mon.status !== 'brn' && mon.status !== 'psn')) return;
      const dmg = Math.max(1, Math.floor(mon.maxhp / (mon.status === 'brn' ? 16 : 8)));
      mon.hp = Math.max(0, mon.hp - dmg);
      events.push({ t: 'statusDmg', side: i, status: mon.status, hp: mon.hp, maxhp: mon.maxhp });
      if (mon.hp <= 0) events.push({ t: 'faint', side: i, name: mon.name });
    });

    // 3) creature esauste: entra la prossima disponibile, oppure fine lotta
    [0, 1].forEach((i) => {
      const side = state.sides[i];
      if (activeMon(side).hp <= 0) {
        const next = side.team.findIndex((m) => m.hp > 0);
        if (next >= 0) {
          side.active = next;
          events.push({ t: 'switch', side: i, to: next, name: activeMon(side).name, forced: true });
        }
      }
    });
    const out = [0, 1].map((i) => state.sides[i].team.every((m) => m.hp <= 0));
    if (out[0] || out[1]) {
      state.winner = out[0] && out[1] ? -1 : out[0] ? 1 : 0;
      events.push({ t: 'end', winner: state.winner });
    }

    state.rngState = rng.state();
    state.log.push(...events);
    return events;
  }

  function effSpeed(mon) { return mon.status === 'par' ? Math.floor(mon.spd / 2) : mon.spd; }

  /** Infligge uno stato se possibile. Ritorna true se è riuscito. */
  function inflict(mon, status, rng, events, side) {
    if (!status || mon.hp <= 0 || mon.status) return false;
    if (STATUS_IMMUNE[status] && SPECIES[mon.species].type === STATUS_IMMUNE[status]) return false;
    mon.status = status;
    if (status === 'slp') mon.slpT = 1 + Math.floor(rng() * 3);   // dorme da 1 a 3 turni
    events.push({ t: 'status', side, status, name: mon.name });
    return true;
  }
  function canInflict(mon, status) {
    return !!status && !mon.status && !(STATUS_IMMUNE[status] && SPECIES[mon.species].type === STATUS_IMMUNE[status]);
  }

  /** Danno medio atteso di una mossa (senza caso): serve all'IA. */
  function expectedDamage(attacker, defender, moveId) {
    const mv = MOVES[moveId];
    if (!mv.power) return 0;
    const atkType = SPECIES[attacker.species].type, defType = SPECIES[defender.species].type;
    const eff = mv.type ? effectiveness(mv.type, defType) : 1;
    const stab = mv.type && mv.type === atkType ? 1.5 : 1;
    const atk = attacker.status === 'brn' ? attacker.atk * 0.5 : attacker.atk;
    const base = Math.floor(Math.floor((2 * attacker.level) / 5 + 2) * mv.power * atk / defender.def / 50) + 2;
    return base * stab * eff * 0.925 * (1 + 0.5 / 16) * (mv.acc / 100);
  }
  function bestDamage(attacker, defender) {
    return Math.max(0, ...attacker.moves.map((m) => expectedDamage(attacker, defender, m)));
  }

  /**
   * Scelta dell'avversario controllato dal telefono.
   * level: 'facile' (mosse a caso), 'normale' (la più forte sul tipo), 'esperto'
   * (danno atteso vero, colpo di grazia sicuro, mosse di stato quando conviene, cambi).
   */
  function aiChoose(state, sideIndex, rngSeed, level) {
    level = level || 'normale';
    const mySide = state.sides[sideIndex];
    const me = activeMon(mySide);
    const them = activeMon(state.sides[1 - sideIndex]);
    const defType = SPECIES[them.species].type;
    const atkType = SPECIES[me.species].type;
    const rng = makeRng(rngSeed >>> 0);
    if (level === 'facile') return { kind: 'move', move: me.moves[Math.floor(rng() * me.moves.length)] };
    if (level !== 'esperto') {
      let best = me.moves[0], bestScore = -1;
      for (const m of me.moves) {
        const mv = MOVES[m];
        const eff = mv.type ? effectiveness(mv.type, defType) : 1;
        const stab = mv.type && mv.type === atkType ? 1.5 : 1;
        let score = mv.power * eff * stab * (mv.acc / 100) * (0.9 + rng() * 0.2);
        if (!mv.power) score = canInflict(them, mv.effect && mv.effect.status) && them.hp / them.maxhp > 0.6 ? 38 * (mv.acc / 100) : 0;
        if (score > bestScore) { bestScore = score; best = m; }
      }
      return { kind: 'move', move: best };
    }
    // ----- esperto -----
    // 1) cambio se la creatura in campo è molto svantaggiata e c'è di meglio in panchina
    const threat = bestDamage(them, me) / Math.max(1, me.hp);
    const myBest = bestDamage(me, them) / Math.max(1, them.hp);
    if (threat >= 0.9 && myBest < 0.5 && me.hp / me.maxhp > 0.35) {
      let pick = -1, pickScore = myBest - threat;
      mySide.team.forEach((m, i) => {
        if (i === mySide.active || m.hp <= 0) return;
        const sc = bestDamage(m, them) / Math.max(1, them.hp) - bestDamage(them, m) / Math.max(1, m.hp);
        if (sc > pickScore + 0.35) { pickScore = sc; pick = i; }
      });
      if (pick >= 0) return { kind: 'switch', to: pick };
    }
    // 2) colpo di grazia: tra le mosse che lo mettono KO scegli la più precisa (priorità se serve)
    const iAmFaster = effSpeed(me) >= effSpeed(them);
    let best = null, bestScore = -1;
    for (const m of me.moves) {
      const mv = MOVES[m];
      const exp = expectedDamage(me, them, m);
      const raw = exp / (mv.acc / 100);
      let score;
      if (mv.power && raw * 0.85 >= them.hp) score = 1000 + mv.acc + ((mv.priority || 0) > 0 && !iAmFaster ? 50 : 0);
      else if (!mv.power) {
        const st = mv.effect && mv.effect.status;
        if (!canInflict(them, st) || them.hp / them.maxhp < 0.5) score = 0;
        else {
          const k = st === 'slp' ? 1.7 : st === 'par' ? (iAmFaster ? 0.7 : 1.3) : st === 'brn' ? (them.atk >= them.def ? 1.3 : 0.9) : 1.0;
          score = bestDamage(me, them) * k * (mv.acc / 100);
        }
      } else {
        score = exp;
        if (mv.effect && canInflict(them, mv.effect.status)) score *= 1 + mv.effect.chance / 250;
      }
      score *= 0.97 + rng() * 0.06;
      if (score > bestScore) { bestScore = score; best = m; }
    }
    return { kind: 'move', move: best || me.moves[0] };
  }

  /** Versione compatta della squadra da mandare al server (niente dati inutili). */
  function teamSnapshot(team) {
    // creature a vita piena, con le statistiche ricalcolate dal livello
    return team.slice(0, 6).map((m) => {
      const fresh = createMonster(m.species, m.level, m.uid, {
        shiny: m.shiny === true,
        talents: validTalents(m.talents) ? m.talents : DEFAULT_TALENTS,
        nature: NATURES[m.nature] ? m.nature : DEFAULT_NATURE,
      });
      fresh.moves = m.moves.slice(0, 4);
      fresh.status = null;               // in sfida si parte sempre sani
      return fresh;
    });
  }

  /** Controlla che una squadra ricevuta sia valida (anti-imbroglio). */
  function validateTeam(team) {
    if (!Array.isArray(team) || team.length < 1 || team.length > 6) return 'La squadra deve avere da 1 a 6 creature.';
    for (const m of team) {
      if (!SPECIES[m.species]) return 'Creatura sconosciuta.';
      if (!(m.level >= 1 && m.level <= 50)) return 'Livello non valido.';
      const allowed = new Set(SPECIES[m.species].learn.filter(([l]) => l <= m.level).map(([, mv]) => mv));
      if (!Array.isArray(m.moves) || m.moves.length < 1 || m.moves.length > 4 || m.moves.some((mv) => !allowed.has(mv))) {
        return 'Mosse non valide per ' + SPECIES[m.species].name + '.';
      }
      if (m.talents != null && !validTalents(m.talents)) return 'Talenti non validi per ' + SPECIES[m.species].name + '.';
      if (m.nature != null && !NATURES[m.nature]) return 'Carattere sconosciuto per ' + SPECIES[m.species].name + '.';
      if (m.shiny != null && typeof m.shiny !== 'boolean') return 'Dato "rara" non valido.';
      const st = statsFor(m.species, m.level, m.talents, m.nature);
      if (m.maxhp !== st.maxhp || m.atk !== st.atk || m.def !== st.def || m.spd !== st.spd) {
        return 'Statistiche modificate per ' + SPECIES[m.species].name + '.';
      }
    }
    return null;
  }

  return {
    TYPES, CHART, MOVES, SPECIES, STARTERS, ZONES, NATURES, STATUS_NAMES, SHINY_RATE,
    makeRng, hashString, effectiveness, statsFor, movesFor, xpForLevel,
    createMonster, recalc, gainXp, xpReward, damage, catchChance,
    createBattle, resolveTurn, aiChoose, activeMon, teamSnapshot, validateTeam, clone, expectedDamage,
  };
});

<script>
/*
 * FMLAB Monsters — il mondo: mappa a caselle, zone, rilievo del terreno.
 * Generato da numeri fissi: è uguale su tutti i telefoni.
 *
 * Caselle:
 *  .  terreno / sentiero        ,  erba alta del prato (incontri)   ;  erba alta del bosco (incontri)

<script>
/*
 * FMLAB Monsters — logica delle sfide (stanze, turni, classifica)
 *
 * Lo stesso file gira in tre posti:
 *  - su Google Apps Script (server vero, dati in PropertiesService)
 *  - nel gioco, in "modalità locale" (dati in localStorage, per provare senza server)
 *  - nei test Node
 * Il server risolve lui ogni turno con il motore: i telefoni mandano solo la mossa.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();

})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const ROOM_TTL_MS = 24 * 60 * 60 * 1000;
  const ONLINE_MS = 90 * 1000;          // visto negli ultimi 90 secondi = online
  const PRESENCE_TTL_MS = 10 * 60 * 1000;
  const INVITE_TTL_MS = 10 * 60 * 1000;
  const HORDE_RATE_MS = 20 * 1000;      // Orda: al massimo un punteggio ogni 20 secondi per giocatore
  const HORDE_KEEP = 50;                // Orda: si tengono i 50 migliori (la classifica resta sotto 9 KB)
  const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // niente 0/O, 1/I

  /**
   * storage: { get(key)->string|null, set(key, string), del(key), keys()->[string], lock(fn), now()->ms, random()->0..1,
   *            cache?: { get(k), put(k, v, ttlSec), getAll([k])->{k:v}, remove(k) } }
   * Su Google la cache è CacheService: non consuma la quota giornaliera delle proprietà (50.000 letture/scritture
   * al giorno per un account Gmail), quindi presenze, inviti, Raid e letture delle stanze passano da lì.
   */
  function createServer(storage, E) {
    const C = storage.cache || fallbackCache();
    function fallbackCache() {           // modalità locale e prove: stessa logica, salvata nello storage normale
      return {
        get(k) {
          const raw = storage.get('c_' + k);
          if (!raw) return null;
          try { const o = JSON.parse(raw); if (o.e < storage.now()) { storage.del('c_' + k); return null; } return o.v; } catch (e) { return null; }
        },
        put(k, v, ttl) { storage.set('c_' + k, JSON.stringify({ v, e: storage.now() + ttl * 1000 })); },
        getAll(keys) { const o = {}; keys.forEach((k) => { const v = this.get(k); if (v != null) o[k] = v; }); return o; },
        remove(k) { storage.del('c_' + k); },
      };
    }
    function load(code) {
      const c = C.get('room_' + code);
      if (c) { try { return JSON.parse(c); } catch (e) { /* cache rovinata: si legge l'originale */ } }
      const raw = storage.get('room_' + code);
      return raw ? JSON.parse(raw) : null;
    }
    function save(room) {
      const json = JSON.stringify(room);
      storage.set('room_' + room.code, json);
      C.put('room_' + room.code, json, 21600);
    }

    function cleanName(name) {
      return String(name || '').replace(/[^\p{L}\p{N} _-]/gu, '').trim().slice(0, 16);
    }

    function newCode() {
      for (let tries = 0; tries < 20; tries++) {
        let c = '';
        for (let i = 0; i < 5; i++) c += CODE_ALPHABET[Math.floor(storage.random() * CODE_ALPHABET.length)];
        if (!load(c)) return c;
      }
      throw new Error('Impossibile creare un codice');
    }

    function cleanup() {
      if (C.get('cleanup_t')) return;     // al massimo una pulizia l'ora: risparmia la quota
      C.put('cleanup_t', '1', 3600);
      const now = storage.now();
      storage.keys().filter((k) => k.indexOf('room_') === 0).forEach((k) => {
        try {
          const r = JSON.parse(storage.get(k));
          if (!r || now - r.updated > ROOM_TTL_MS) { storage.del(k); C.remove(k); }
        } catch (e) { storage.del(k); }
      });
    }

    function cleanPid(pid) { const v = String(pid || ''); return /^[a-z0-9]{8,16}$/.test(v) ? v : ''; }
    function readInvites(pid) {
      let list = [];
      try { list = JSON.parse(C.get('inv_' + pid) || '[]'); } catch (e) { list = []; }
      const now = storage.now();
      return list.filter((i) => now - i.t < INVITE_TTL_MS && (() => {
        if (i.kind === 'raid') { const rd = loadRaid(i.code); return rd && rd.status === 'lobby'; }
        const r = load(i.code); return r && r.status === 'waiting';

    }
    const PRES_TTL_S = Math.round(PRESENCE_TTL_MS / 1000);
    function presenceOf(pid) { const v = C.get('pres_' + pid); try { return v ? JSON.parse(v) : null; } catch (e) { return null; } }

    // ---------- Raid cooperativo: fino a 5 amici contro un boss con la vita in comune ----------
    const RAID_LV_UP = Number(storage.raidLvUp || 2), RAID_ATK = Number(storage.raidAtk || 0.5), RAID_HP_BASE = 1.5, RAID_HP_PER = 1.4;
    const RAID_MAX = 5, RAID_TTL_S = 3600, RAID_TIME_MS = 12 * 60 * 1000, RAID_MOVE_MS = 700;
    const RAID_BOSSES = ['vulkarn', 'abissaro', 'silvatron', 'granitor', 'spettrax', 'fulmix'];
    function loadRaid(code) { const v = C.get('raid_' + code); try { return v ? JSON.parse(v) : null; } catch (e) { return null; } }
    function saveRaid(r) { r.updated = storage.now(); C.put('raid_' + r.code, JSON.stringify(r), RAID_TTL_S); }
    function newRaidCode() {
      for (let tries = 0; tries < 20; tries++) {
        let c = 'R';
        for (let i = 0; i < 4; i++) c += CODE_ALPHABET[Math.floor(storage.random() * CODE_ALPHABET.length)];
        if (!loadRaid(c)) return c;
      }
      throw new Error('Impossibile creare un codice');
    }
    function laneHp(lane) { const t = lane.sides[0].team; return t.reduce((a, m) => a + Math.max(0, m.hp), 0) / Math.max(1, t.reduce((a, m) => a + m.maxhp, 0)); }
    function raidView(r, pid, extra) {
      const me = r.players.find((x) => x.pid === pid);
      const out = {
        ok: true, code: r.code, status: r.status, host: r.host === pid, joined: !!me,
        boss: { species: r.boss.species, level: r.boss.level, hp: r.boss.hp, maxhp: r.boss.maxhp },
        players: r.players.map((x) => ({ name: x.name, lead: (x.team[0] || {}).species, hp: x.lane ? Math.round(laneHp(x.lane) * 100) : 100, dealt: x.dealt, done: x.done })),
        log: r.log, left: r.started ? Math.max(0, RAID_TIME_MS - (storage.now() - r.started)) : RAID_TIME_MS,
      };
      if (me && me.lane) out.me = { turn: me.lane.turn, winner: me.lane.winner, sides: me.lane.sides, done: me.done };
      return Object.assign(out, extra || {});
    }

    function parseTeam(json) {
      let team;
      try { team = typeof json === 'string' ? JSON.parse(json) : json; } catch (e) { return { error: 'Squadra non leggibile.' }; }
      if (!Array.isArray(team)) return { error: 'Squadra non valida.' };
      // 1) la squadra ricevuta deve essere onesta (statistiche coerenti col livello, mosse imparate)
      const err = E.validateTeam(team);
      if (err) return { error: err };
      // 2) il server usa comunque una copia ricalcolata, a vita piena
      return { team: E.teamSnapshot(team) };
    }

    function publicState(room, side) {
      const b = room.battle;
      return {
        ok: true,
        code: room.code,
        status: room.status,
        you: side,
        names: room.players.map((p) => p.name),
        turn: b ? b.turn : 0,
        winner: room.winner,
        waitingFor: room.status === 'playing'
          ? [0, 1].filter((i) => !(room.pending && room.pending[i] != null))
          : [],
        sides: b ? b.sides.map((s) => ({ name: s.name, active: s.active, team: s.team })) : null,
        lastEvents: room.lastEvents || [],
        history: (room.history || []).slice(-24),
      };
    }

    function updateLeaderboard(winnerName, loserName) {
      const raw = storage.get('leaderboard');
      const lb = raw ? JSON.parse(raw) : {};
      lb[winnerName] = lb[winnerName] || { wins: 0, losses: 0 };
      lb[loserName] = lb[loserName] || { wins: 0, losses: 0 };
      lb[winnerName].wins += 1;
      lb[loserName].losses += 1;
      storage.set('leaderboard', JSON.stringify(lb));
    }

    const actions = {
      ping() { return { ok: true, server: 'FMLAB Monsters', time: storage.now() }; },

      create(p) {
        const name = cleanName(p.name);
        if (!name) return { ok: false, error: 'Scegli un nome.' };
        const t = parseTeam(p.team);
        if (t.error) return { ok: false, error: t.error };
        cleanup();
        const code = newCode();
        const room = {
          code, seed: Math.floor(storage.random() * 4294967295) >>> 0,
          status: 'waiting', created: storage.now(), updated: storage.now(),
          players: [{ name, team: t.team }], pending: {}, battle: null, winner: null, lastEvents: [], history: [],
        };
        save(room);
        return publicState(room, 0);
      },

      join(p) {
        const code = String(p.code || '').toUpperCase().trim();
        const room = load(code);
        if (!room) return { ok: false, error: 'Stanza non trovata. Controlla il codice.' };
        if (room.status !== 'waiting') return { ok: false, error: 'La sfida è già iniziata.' };
        const name = cleanName(p.name);
        if (!name) return { ok: false, error: 'Scegli un nome.' };
        if (name === room.players[0].name) return { ok: false, error: 'Usa un nome diverso dal tuo amico.' };
        const t = parseTeam(p.team);
        if (t.error) return { ok: false, error: t.error };

        room.battle = E.createBattle(room.seed, room.players.map((pl) => ({ name: pl.name, team: pl.team })));
        // le squadre ora vivono nella lotta: niente doppioni (limite 9 KB per stanza su Google)
        room.players = room.players.map((pl) => ({ name: pl.name }));

        room.updated = storage.now();
        save(room);
        return publicState(room, 1);
      },

      move(p) {
        const room = load(String(p.code || '').toUpperCase());
        if (!room) return { ok: false, error: 'Stanza non trovata.' };
        if (room.status !== 'playing') return publicState(room, Number(p.side));
        const side = Number(p.side);
        if (side !== 0 && side !== 1) return { ok: false, error: 'Lato non valido.' };
        if (Number(p.turn) !== room.battle.turn + 1) return publicState(room, side); // mossa vecchia o doppia
        let action;
        // la mossa viaggia nel parametro "act" ("action" è il nome dell'operazione)
        try { action = typeof p.act === 'string' ? JSON.parse(p.act) : p.act; } catch (e) { return { ok: false, error: 'Mossa non leggibile.' }; }
        if (!action || !action.kind) return { ok: false, error: 'Mossa mancante.' };
        const mySide = room.battle.sides[side];
        const me = mySide.team[mySide.active];
        if (action.kind === 'move' && !me.moves.includes(action.move)) return { ok: false, error: 'Mossa non disponibile.' };
        if (action.kind === 'switch' && !(mySide.team[action.to] && mySide.team[action.to].hp > 0)) return { ok: false, error: 'Cambio non valido.' };
        if (action.kind === 'forfeit') {
          room.status = 'ended';
          room.winner = 1 - side;
          room.lastEvents = [{ t: 'forfeit', side }, { t: 'end', winner: room.winner }];
          updateLeaderboard(room.players[room.winner].name, room.players[side].name);
          room.updated = storage.now();
          save(room);
          return publicState(room, side);
        }
        room.pending = room.pending || {};
        room.pending[side] = action;
        if (room.pending[0] != null && room.pending[1] != null) {
          const events = E.resolveTurn(room.battle, [room.pending[0], room.pending[1]]);
          room.battle.log = []; // lo stato resta piccolo: teniamo solo l'ultimo turno
          room.lastEvents = events;
          room.history = (room.history || []).concat(events).slice(-24);
          room.pending = {};
          if (room.battle.winner != null) {
            room.status = 'ended';
            room.winner = room.battle.winner;
            if (room.winner === 0 || room.winner === 1) {
              updateLeaderboard(room.players[room.winner].name, room.players[1 - room.winner].name);
            }
          }
        }
        room.updated = storage.now();
        save(room);
        return publicState(room, side);
      },

      state(p) {
        const room = load(String(p.code || '').toUpperCase());
        if (!room) return { ok: false, error: 'Stanza non trovata.' };
        return publicState(room, Number(p.side));
      },

      /** Sala Online: "ci sono" + chi altro c'è + inviti per me, in una sola chiamata. */
      hello(p) {
        const pid = cleanPid(p.pid), name = cleanName(p.name);
        if (!pid || !name) return { ok: false, error: 'Giocatore non valido.' };
        const now = storage.now();
        const lead = E.SPECIES[p.lead] ? p.lead : null;
        const xy = (v) => { const n = Number(v); return Number.isInteger(n) && n >= 0 && n < 400 ? n : null; };
        const me = { name, lead, shiny: p.shiny === true || p.shiny === 'true', lv: Math.max(1, Math.min(100, Number(p.lv) || 1)), zone: cleanName(p.zone).slice(0, 14), x: xy(p.x), y: xy(p.y), t: now };
        C.put('pres_' + pid, JSON.stringify(me), PRES_TTL_S);
        let idx = [];
        try { idx = JSON.parse(C.get('pres_idx') || '[]'); } catch (e) { idx = []; }
        if (idx.indexOf(pid) < 0) idx.push(pid);
        const vals = C.getAll(idx.map((k) => 'pres_' + k));
        const alive = idx.filter((k) => k === pid || vals['pres_' + k]);
        C.put('pres_idx', JSON.stringify(alive.slice(-80)), PRES_TTL_S);
        const online = [];
        alive.forEach((k) => {
          if (k === pid) return;
          let v = null;
          try { v = JSON.parse(vals['pres_' + k]); } catch (e) { v = null; }
          if (v && now - v.t <= ONLINE_MS) online.push({ pid: k, name: v.name, lead: v.lead, shiny: !!v.shiny, lv: v.lv, zone: v.zone, x: v.x, y: v.y });
        });
        online.sort((a, b) => a.name.localeCompare(b.name));
        return { ok: true, online: online.slice(0, 30), invites: readInvites(pid) };
      },

      invite(p) {
        const from = cleanPid(p.pid), to = cleanPid(p.to), name = cleanName(p.name);
        if (!from || !to || !name || from === to) return { ok: false, error: 'Invito non valido.' };
        const code = String(p.code || '').toUpperCase().trim();
        const kind = p.kind === 'raid' ? 'raid' : 'sfida';
        if (kind === 'raid') {
          const rd = loadRaid(code);
          if (!rd || rd.status !== 'lobby' || !rd.players.some((x) => x.pid === from)) return { ok: false, error: 'Crea prima un Raid.' };
        } else {
          const room = load(code);
          if (!room || room.status !== 'waiting' || room.players[0].name !== name) return { ok: false, error: 'Crea prima una sfida.' };
        }
        if (!presenceOf(to)) return { ok: false, error: 'Il tuo amico non è più online.' };
        const list = readInvites(to).filter((i) => !(i.fromPid === from && i.kind === kind));
        list.push({ from: name, fromPid: from, code, kind, t: storage.now() });
        C.put('inv_' + to, JSON.stringify(list.slice(-5)), Math.round(INVITE_TTL_MS / 1000));
        return { ok: true };
      },

      decline(p) {
        const pid = cleanPid(p.pid), code = String(p.code || '').toUpperCase().trim();
        if (!pid) return { ok: false, error: 'Giocatore non valido.' };
        C.put('inv_' + pid, JSON.stringify(readInvites(pid).filter((i) => i.code !== code)), Math.round(INVITE_TTL_MS / 1000));
        return { ok: true };
      },

      raidCreate(p) {
        const pid = cleanPid(p.pid), name = cleanName(p.name);
        if (!pid || !name) return { ok: false, error: 'Giocatore non valido.' };
        const t = parseTeam(p.team);
        if (t.error) return { ok: false, error: t.error };
        const day = new Date(storage.now()).toISOString().slice(0, 10);
        const r = {
          code: newRaidCode(), host: pid, status: 'lobby', created: storage.now(), started: 0, seed: Math.floor(storage.random() * 4294967295) >>> 0,
          boss: { species: RAID_BOSSES[E.hashString('raid' + day) % RAID_BOSSES.length], level: 0, hp: 0, maxhp: 0 },
          players: [{ pid, name, team: t.team, dealt: 0, lane: null, done: false, last: 0 }], log: [],
        };
        saveRaid(r);
        return raidView(r, pid);
      },

      raidJoin(p) {
        const pid = cleanPid(p.pid), name = cleanName(p.name);
        if (!pid || !name) return { ok: false, error: 'Giocatore non valido.' };
        const r = loadRaid(String(p.code || '').toUpperCase().trim());
        if (!r) return { ok: false, error: 'Raid non trovato. Controlla il codice.' };
        if (r.players.some((x) => x.pid === pid)) return raidView(r, pid);
        if (r.status !== 'lobby') return { ok: false, error: 'Il Raid è già cominciato.' };
        if (r.players.length >= RAID_MAX) return { ok: false, error: 'Il Raid è pieno (5 giocatori).' };
        if (r.players.some((x) => x.name === name)) return { ok: false, error: 'C\'è già un giocatore con questo nome.' };
        const t = parseTeam(p.team);
        if (t.error) return { ok: false, error: t.error };
        r.players.push({ pid, name, team: t.team, dealt: 0, lane: null, done: false, last: 0 });
        saveRaid(r);
        return raidView(r, pid);
      },

      raidStart(p) {
        const pid = cleanPid(p.pid);
        const r = loadRaid(String(p.code || '').toUpperCase().trim());
        if (!r) return { ok: false, error: 'Raid non trovato.' };
        if (r.host !== pid) return { ok: false, error: 'Solo chi ha creato il Raid può farlo partire.' };
        if (r.status !== 'lobby') return raidView(r, pid);
        const n = r.players.length;
        const avg = r.players.reduce((a, x) => a + Math.max.apply(null, x.team.map((m) => m.level)), 0) / n;
        // come nei Raid veri: tanta vita in comune, colpi meno devastanti, livello poco sopra la squadra
        const level = Math.max(12, Math.min(70, Math.round(avg) + RAID_LV_UP));
        const boss = E.createMonster(r.boss.species, level, 'boss', { shiny: false, talents: [12, 12, 12, 12] });
        // forza dei colpi che cresce col livello: duro ma battibile a 15, impegnativo a 30+
        boss.atk = Math.max(5, Math.round(boss.atk * Math.max(0.45, Math.min(1, RAID_ATK + (level - 17) * 0.04))));
        const maxhp = Math.round(boss.maxhp * (RAID_HP_BASE + RAID_HP_PER * n));
        r.boss.level = level; r.boss.maxhp = maxhp; r.boss.hp = maxhp;
        r.players.forEach((x, i) => {
          const b = E.clone(boss); b.maxhp = maxhp; b.hp = maxhp; b.name = boss.name + ' Gigante';
          x.lane = E.createBattle((r.seed + i * 7919) >>> 0, [{ name: x.name, team: x.team }, { name: 'Boss', team: [b] }]);
          x.team = x.team.map((m) => ({ species: m.species, level: m.level })); // la squadra vive nella lotta
        });
        r.status = 'fight';
        r.started = storage.now();
        saveRaid(r);
        return raidView(r, pid);
      },

      raidMove(p) {
        const pid = cleanPid(p.pid);
        const r = loadRaid(String(p.code || '').toUpperCase().trim());
        if (!r) return { ok: false, error: 'Raid non trovato.' };
        const me = r.players.find((x) => x.pid === pid);
        if (!me) return { ok: false, error: 'Non sei in questo Raid.' };
        const now = storage.now();
        if (r.status === 'fight' && now - r.started > RAID_TIME_MS) { r.status = 'lost'; saveRaid(r); }
        if (r.status !== 'fight' || me.done) return raidView(r, pid);
        if (Number(p.turn) !== me.lane.turn + 1) return raidView(r, pid);
        if (now - me.last < RAID_MOVE_MS) return raidView(r, pid, { wait: true });
        let action;
        try { action = typeof p.act === 'string' ? JSON.parse(p.act) : p.act; } catch (e) { return { ok: false, error: 'Mossa non leggibile.' }; }
        const side = me.lane.sides[0], mon = side.team[side.active];
        if (!action || (action.kind !== 'move' && action.kind !== 'switch')) return { ok: false, error: 'Mossa non valida.' };
        if (action.kind === 'move' && !mon.moves.includes(action.move)) return { ok: false, error: 'Mossa non disponibile.' };
        if (action.kind === 'switch' && !(side.team[action.to] && side.team[action.to].hp > 0)) return { ok: false, error: 'Cambio non valido.' };
        const bossMon = me.lane.sides[1].team[0];
        bossMon.hp = r.boss.hp;                       // la vita del boss è in comune
        const before = r.boss.hp;
        const events = E.resolveTurn(me.lane, [action, E.aiChoose(me.lane, 1, (r.seed + now) >>> 0, 'normale')]);
        me.lane.log = [];
        const dealt = Math.max(0, before - Math.max(0, bossMon.hp));
        r.boss.hp = Math.max(0, before - dealt);
        me.dealt += dealt;
        me.last = now;
        if (dealt > 0) r.log = r.log.concat([{ n: me.name, d: dealt }]).slice(-8);
        if (r.boss.hp <= 0) r.status = 'won';
        else if (me.lane.winner === 1 || me.lane.sides[0].team.every((m) => m.hp <= 0)) {
          me.done = true;
          if (r.players.every((x) => x.done)) r.status = 'lost';
        }
        saveRaid(r);
        return raidView(r, pid, { lastEvents: events, dealt });
      },

      raidState(p) {
        const pid = cleanPid(p.pid);
        const r = loadRaid(String(p.code || '').toUpperCase().trim());
        if (!r) return { ok: false, error: 'Raid non trovato.' };
        if (r.status === 'fight' && storage.now() - r.started > RAID_TIME_MS) { r.status = 'lost'; saveRaid(r); }
        return raidView(r, pid);
      },

      /** Modalità Orda: invio del punteggio con controlli di plausibilità. */
      hordeScore(p) {
        const pid = cleanPid(p.pid), name = cleanName(p.name);
        if (!pid || !name) return { ok: false, error: 'Giocatore non valido.' };
        const wave = Number(p.wave), score = Number(p.score);
        if (!Number.isInteger(wave) || wave < 1 || wave > 300) return { ok: false, error: 'Ondata non valida.' };
        if (!Number.isInteger(score) || score < 0 || score > wave * 5000) return { ok: false, error: 'Punteggio non valido.' };
        if (!E.SPECIES[p.species]) return { ok: false, error: 'Creatura non valida.' };
        const now = storage.now();
        let rate = {};
        try { rate = JSON.parse(storage.get('horde_rate') || '{}'); } catch (e) { rate = {}; }
        Object.keys(rate).forEach((k) => { if (now - rate[k] > HORDE_RATE_MS * 3) delete rate[k]; });
        if (rate[pid] && now - rate[pid] < HORDE_RATE_MS) return { ok: false, error: 'Aspetta qualche secondo prima di inviare un altro punteggio.' };
        rate[pid] = now;
        storage.set('horde_rate', JSON.stringify(rate));
        let lb = {};
        try { lb = JSON.parse(storage.get('horde_lb') || '{}'); } catch (e) { lb = {}; }
        const prev = lb[name];
        const best = !prev || score > prev.s;
        if (best) lb[name] = { s: score, w: wave, sp: p.species, t: now };
        // si tengono solo i migliori: la chiave resta piccola
        const names = Object.keys(lb).sort((a, b) => lb[b].s - lb[a].s);
        names.slice(HORDE_KEEP).forEach((n) => delete lb[n]);
        storage.set('horde_lb', JSON.stringify(lb));
        const rank = names.indexOf(name) + 1;
        return { ok: true, best, rank: rank > 0 && rank <= HORDE_KEEP ? rank : null };
      },

      hordeTop() {
        let lb = {};
        try { lb = JSON.parse(storage.get('horde_lb') || '{}'); } catch (e) { lb = {}; }
        const rows = Object.keys(lb).map((name) => ({ name, score: lb[name].s, wave: lb[name].w, species: lb[name].sp }))
          .sort((a, b) => b.score - a.score).slice(0, 20);
        return { ok: true, rows };
      },

      leaderboard() {
        const raw = storage.get('leaderboard');
        const lb = raw ? JSON.parse(raw) : {};
        const rows = Object.keys(lb).map((name) => ({ name, wins: lb[name].wins, losses: lb[name].losses }))
          .sort((a, b) => b.wins - a.wins || a.losses - b.losses).slice(0, 20);
        return { ok: true, rows };
      },
    };

    function handle(params) {
      const fn = actions[params && params.action];
      if (!fn) return { ok: false, error: 'Azione sconosciuta.' };
      try {
        return storage.lock(() => fn(params));
      } catch (e) {
        return { ok: false, error: 'Errore del server: ' + (e && e.message ? e.message : e) };
      }
    }

    return { handle };
  }

  return { createServer };
});

/*
 * FMLAB Monsters — motore 3D in WebGL puro (nessuna libreria esterna).
 *

    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],

  function loadGLB(buf) {
    const dv = new DataView(buf);

  // ---------- costruzione e cache ----------
  const RIGS = new Map();
  const TRI_BUDGET = { 1: 2300, 2: 2600, 3: 3000 };
  function rigFor(id, shiny) {
    const key = id + (shiny ? '*' : '');
    let r = RIGS.get(key);
    if (r) return r;
    if (!SPECIES[id]) return null;
    const P = colors(id, shiny), limit = TRI_BUDGET[P.stage] || 2500;
    for (DETAIL_BIAS = 0; DETAIL_BIAS <= 8; DETAIL_BIAS++) {
      r = new Rig(key);
      SPECIES[id](r, P);
      if (r.tris <= limit) break;
    }
    r.detailBias = Math.min(DETAIL_BIAS, 8);
    DETAIL_BIAS = 0;
    // altezza reale del modello (per chi la vuole sapere)
    let top = 0;
    r.parts.forEach((p) => { const d = p.builder.d; for (let i = 1; i < d.length; i += STRIDE) top = Math.max(top, d[i] + p.pivot[1]); });
    r.top = top;
    r.hash = E.hashString(key);
    RIGS.set(key, r);
    return r;
  }

  // ---------- pose ----------
  const I3 = [0, 0, 0], ONE = [1, 1, 1];
  function creatureState(rig, anim) {
    const A = anim.action || 'idle', t = anim.t || 0, ph = (anim.phase || 0) + (rig.hash % 100) * 0.07, since = anim.since || 0;
    const period = 3.4 + (rig.hash % 23) / 10, bt = (t + ph * 0.61) % period;
    let blink = bt < 0.15 ? Math.sin((Math.PI * bt) / 0.15) : 0;
    const sleep = A === 'sleep', faint = A === 'faint' ? clamp01(since / 0.7) : 0;
    if (sleep || A === 'faint') blink = 1;
    return {
      A, t, ph, blink, sleep, faint,
      br: Math.sin(t * (sleep ? 1.1 : 2.3) + ph),
      atk: A === 'attack' ? Math.sin(Math.PI * clamp01(since / 0.5)) : 0,
      wind: A === 'attack' ? Math.max(0, 1 - since / 0.12) : 0,
      hit: A === 'hit' ? Math.sin(Math.PI * clamp01(since / 0.55)) : 0,
      squint: A === 'hit' ? 1 - clamp01(since / 0.55) : 0,
      walk: A === 'walk', w: A === 'walk' ? t * 10 + ph : 0,
      lookY: Math.sin(t * 0.45 + ph) * 0.32 + Math.sin(t * 1.7 + ph * 2) * 0.05,
      lookP: Math.sin(t * 0.31 + ph * 1.3) * 0.12,
    };
  }
  function rootPose(rig, s) {
    const k = rig.kind;
    let ty = 0, sx = 1, sy = 1, pitch = 0, roll = 0;
    sy += s.br * (s.sleep ? 0.03 : 0.014); sx -= s.br * 0.007;
    if (s.walk) {
      if (k === 'blob') { ty = Math.abs(Math.sin(s.w)) * 0.08; sy += Math.cos(2 * s.w) * 0.05; sx -= Math.cos(2 * s.w) * 0.025; roll = Math.sin(s.w) * 0.06; }
      else if (k === 'ghost') { ty = Math.sin(s.w * 0.5) * 0.04; pitch = 0.08; }
      else { ty = Math.abs(Math.sin(s.w)) * 0.03; roll = Math.sin(s.w) * 0.03; }
    }
    if (k === 'ghost') { ty += Math.sin(s.t * 1.6 + s.ph) * 0.03; roll += Math.sin(s.t * 1.1 + s.ph) * 0.04; }
    pitch += s.atk * 0.3 - s.wind * 0.12 - s.hit * 0.28 + (s.sleep ? 0.08 : 0);
    if (s.faint) { roll += s.faint * (k === 'quad' ? 0.25 : 1.2) * (s.ph % 2 > 1 ? 1 : -1); sy *= 1 - s.faint * 0.22; pitch += s.faint * 0.25; }
    return { t: [0, ty, 0], r: [0, pitch, roll], s: [sx, sy, sx] };
  }
  function partPose(p, s, rig) {
    const sd = p.side || 1;
    switch (p.role) {
      case 'head': return { r: [s.lookY * 0.45, s.lookP * 0.6 + s.atk * 0.18 - s.hit * 0.25 + (s.sleep ? 0.32 : 0) + s.faint * 0.4, s.sleep ? 0.12 : 0] };
      case 'eye': {
        const closed = Math.max(s.blink, s.squint * 0.8);
        return { r: [s.lookY * 0.8, -s.lookP, 0], s: [1 + s.squint * 0.1, Math.max(0.09, 1 - 0.93 * closed), 1], closed: closed > 0.55 };
      }
      case 'mouth': { const o = Math.max(s.atk, s.hit * 0.85, s.sleep ? 0 : 0); return { s: [1 + o * 0.15, 0.32 + o * 0.95 + (s.sleep ? 0 : 0.03 * s.br), 1] }; }
      case 'arm': {
        if (p.float) return { r: [Math.sin(s.t * 1.8 + sd) * 0.12 - s.atk * 0.9, 0, sd * (Math.sin(s.t * 1.3 + sd) * 0.1 + s.hit * 0.5)] };
        if (p.flipper) return { r: [0, 0, sd * (Math.sin(s.t * 2 + sd) * 0.1 + (s.walk ? Math.sin(s.w * 2) * 0.35 : 0) - s.atk * 0.4 + s.hit * 0.4)] };
        let pitch = -s.atk * 1.15 + s.wind * 0.4, roll = sd * (0.06 + s.br * 0.03 + s.hit * 0.55);
        if (s.walk) pitch += Math.sin(s.w) * 0.6 * sd;
        if (rig.kind === 'blob' && s.walk) roll += sd * Math.abs(Math.sin(s.w)) * 0.35;
        if (s.faint) roll += sd * s.faint * 0.6;
        return { r: [0, pitch, roll] };
      }
      case 'leg': {
        if (!s.walk) return { r: [0, s.faint * -0.2, 0] };
        const off = rig.kind === 'quad' ? (p.back ? Math.PI : 0) : 0;
        const sw = Math.sin(s.w + off) * sd;
        return { r: [0, -sw * (rig.kind === 'blob' ? 0.3 : 0.55), 0], t: [0, Math.max(0, -Math.cos(s.w + off) * sd) * (rig.kind === 'blob' ? 0.02 : 0.04), 0] };
      }
      case 'tail': {
        const wag = Math.sin(s.t * (s.walk ? 6 : 2.4) + s.ph) * (s.walk ? 0.35 : 0.22);
        return { r: [wag, 0.06 * s.br - s.atk * 0.35 + s.hit * 0.3 + (p.spring ? Math.sin(s.t * 5) * 0.08 : 0), 0], s: p.spring ? [1, 1 + Math.sin(s.t * 5 + s.ph) * 0.06, 1] : ONE };
      }
      case 'sway': {
        const v = Math.sin(s.t * (p.freq || 2) + (p.ph || 0) + s.ph) * (p.amp || 0.1) * (s.walk ? 1.6 : 1) + s.hit * 0.2;
        const r = [0, 0, 0]; r[p.axis == null ? 2 : p.axis] = v; return { r };
      }
      case 'flame': {
        const f = Math.sin(s.t * 13 + (p.ph || 0)) * 0.12 + Math.sin(s.t * 21 + 1) * 0.06;
        return { r: [Math.sin(s.t * 6) * 0.08, s.walk ? -0.15 : 0, Math.sin(s.t * 4.3) * 0.07], s: [1 - f * 0.4, 1 + f + s.atk * 0.35 - (s.sleep ? 0.3 : 0) - s.faint * 0.6, 1 - f * 0.4] };
      }
      case 'wisp': return { r: [Math.sin(s.t * 1.3 + s.ph) * 0.15, Math.sin(s.t * 2.1) * 0.1 + (s.walk ? -0.25 : 0), Math.sin(s.t * 1.7) * 0.12] };
      default: return null;
    }
  }
  function compose(parentM, p, pose, parentPivot) {
    const t = pose && pose.t ? pose.t : I3;
    const pp = parentPivot || I3;
    return mmul(parentM, mat([p.pivot[0] - pp[0] + t[0], p.pivot[1] - pp[1] + t[1], p.pivot[2] - pp[2] + t[2]], pose && pose.r ? pose.r : null, pose && pose.s ? pose.s : null));
  }
  const CLOSED_TINT = [0.16, 0.12, 0.14];
  function drawRig(R, rig, model, drawOpts, s) {
    const rp = rootPose(rig, s);
    const rootM = mmul(model, mat(rp.t, rp.r, rp.s));
    const world = {};
    for (const p of rig.parts) {
      const parent = p.parent ? rig.by[p.parent] : null;
      const pm = parent ? world[parent.name] : rootM;
      const pose = partPose(p, s, rig);
      const M = compose(pm, p, pose, parent ? parent.pivot : null);
      world[p.name] = M;
      const o = Object.assign({}, drawOpts);
      if (p.alpha) { o.alpha = (o.alpha == null ? 1 : o.alpha) * p.alpha; o.blend = true; }
      if (pose && pose.closed) o.tint = CLOSED_TINT;
      R.draw(mesh(p.key, () => p.builder), M, o);
    }
  }

  // creatura in un pezzo (posa di riposo), per chi chiede il modello intero
  function bakedCreature(id, shiny) {
    const rig = rigFor(id, shiny);
    if (!rig) return null;
    const out = new Builder(rig.hash), world = {};
    for (const p of rig.parts) {
      const parent = p.parent ? rig.by[p.parent] : null;
      const M = compose(parent ? world[parent.name] : mat(), p, null, parent ? parent.pivot : null);
      world[p.name] = M;
      const start = out.d.length;
      out.addBuilder(p.builder, M);
      if (p.role !== 'leg' || true) smoothFromIfSmooth(out, start, p);
    }
    return out;
  }
  function smoothFromIfSmooth(b, start, p) { if (!/sassetto|granitor/.test(p.key)) smoothFrom(b, start); }

  // ---------- nemici ----------
  function zoneForWave(w) {

    const z = w <= 3 ? ['prato'] : w <= 6 ? ['prato', 'fiume'] : w <= 10 ? ['fiume', 'bosco'] : w <= 14 ? ['bosco', 'grotta'] : ['bosco', 'grotta', 'fiume'];

  }
  function makeEnemy(species, level, opts) {

    const wave = G.wave;
    const hpMul = (0.55 + wave * 0.045) * (opts.hpMul || 1);

    const rr = Math.hypot(x, z);
    if (rr > ARENA_R) { x *= ARENA_R / rr; z *= ARENA_R / rr; }
    if (Math.hypot(x - G.x, z - G.z) < 6) { x = -x * 0.9; z = -z * 0.9; }
    const scale = (opts.scale || 1) * (0.9 + sp.stage * 0.08);
    return {
      uid: G.nextUid++, sp: species, type: sp.type, lvl: level, x, z, kx: 0, kz: 0,
      hp: Math.round(st.maxhp * hpMul), maxhp: Math.round(st.maxhp * hpMul), atk: st.atk * (opts.atkMul || 1), def: st.def,
      speed: (1.7 + st.spd / 85 + wave * 0.025) * (opts.spdMul || 1), r: 0.42 * scale, scale,
      boss: opts.boss || 0, title: opts.title || '', flash: 0, phase: Math.random() * 10, yaw: 0, leafCd: 0, slowT: 0, dot: 0, ghost: sp.type === 'ombra',
      shiny: Math.random() < 1 / 300, dead: false, deadT: 0, born: G.time,

  function spawnNormal(n) {

  const aliveNormal = () => { let n = 0; for (const e of G.enemies) if (!e.dead && !e.boss) n++; return n; };
  function evolved(sp, lvl) { const S = ctx.E.SPECIES; let s = sp; while (S[s].evo && lvl >= S[s].evo.level) s = S[s].evo.to; return s; }
  function spawnMiniBoss() {

  function guardians() {
    const T = root.FMLABStory && root.FMLABStory.TRAINERS;
    if (T) {

  function spawnGuardian() {
